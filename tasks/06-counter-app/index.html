<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 6 — JavaScript Counter App</title>
  <meta name="description" content="A counter app built with ES6+ JavaScript and DOM events, with a step size, limits, keyboard shortcuts and persistence." />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <section class="counter card" aria-labelledby="counter-title">
      <header>
        <span class="eyebrow">Task 6</span>
        <h1 id="counter-title">Counter</h1>
        <p class="sub">DOM manipulation, events and <code>localStorage</code>.</p>
      </header>

      <output class="value" id="value" aria-live="polite" aria-atomic="true">0</output>
      <p class="limit-msg" id="limit-msg" role="status" aria-live="polite"></p>

      <div class="controls">
        <button class="btn round" id="decrement" type="button" aria-label="Decrease">&minus;</button>
        <button class="btn reset" id="reset" type="button">Reset</button>
        <button class="btn round primary" id="increment" type="button" aria-label="Increase">+</button>
      </div>

      <div class="settings">
        <div class="setting">
          <label for="step">Step</label>
          <input type="number" id="step" value="1" min="1" max="100" />
        </div>
        <div class="setting">
          <label for="min">Min</label>
          <input type="number" id="min" value="-50" />
        </div>
        <div class="setting">
          <label for="max">Max</label>
          <input type="number" id="max" value="50" />
        </div>
      </div>

      <dl class="stats">
        <div><dt>Clicks</dt><dd id="clicks">0</dd></div>
        <div><dt>Highest</dt><dd id="highest">0</dd></div>
        <div><dt>Lowest</dt><dd id="lowest">0</dd></div>
      </dl>

      <p class="keys">
        Keyboard: <kbd>&uarr;</kbd> / <kbd>&rarr;</kbd> increase ·
        <kbd>&darr;</kbd> / <kbd>&larr;</kbd> decrease ·
        <kbd>R</kbd> reset. Hold the buttons to repeat. The value is saved,
        so it survives a reload.
      </p>
    </section>

    <p><a class="back" href="../../index.html">&larr; Back to the portfolio</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
